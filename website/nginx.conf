server {
    listen 80;
    server_name loop.shoaib.xyz;

    root /var/www/loop-eng;

    location ^~ /.well-known/acme-challenge/ {
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 308 https://loop.shoaib.xyz$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name loop.shoaib.xyz;

    ssl_certificate /etc/letsencrypt/live/loop.shoaib.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/loop.shoaib.xyz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/loop-eng;
    index index.html;

    access_log /var/log/nginx/loop-access.log;
    error_log /var/log/nginx/loop-error.log;

    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; script-src 'none'; connect-src 'none'; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'none'" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
